<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-top:1px solid rgba(255,255,255,0.08); padding:12px {{ barPad }}px 12px {{ padX }}px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:4px 16px; font-family:'Geist Mono',monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#8C8A86; background:#0E0F10;">
  <span style="padding:14px 0; line-height:1.5;">context labs · made by khalid · submissions open · cc by 4.0</span>
  <div style="display:flex; align-items:center; margin-left:{{ linksShift }}px;">
    <a href="#" onClick="{{ noop }}" style="display:flex; align-items:center; gap:6px; height:44px; padding:0 14px; color:#8C8A86; text-decoration:none;" style-hover="color:#EDEBE7;">submit <svg width="9" height="9" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 13L13 1M3.5 1H13V10.5"></path></svg></a>
    <a href="#" onClick="{{ noop }}" style="display:flex; align-items:center; gap:6px; height:44px; padding:0 14px; color:#8C8A86; text-decoration:none;" style-hover="color:#EDEBE7;">x <svg width="9" height="9" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 13L13 1M3.5 1H13V10.5"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:80},&quot;bp&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;d&quot;,&quot;t&quot;,&quot;m&quot;],&quot;default&quot;:&quot;d&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  noop = e => e.preventDefault();
  renderVals() {
    const bp = this.props.bp ?? 'd';
    const pad = bp === 'm' ? 20 : 24;
    return { noop: this.noop, padX: pad, barPad: pad - 14, linksShift: bp === 'm' ? -14 : 0 };
  }
}
</script>
</body>
</html>
