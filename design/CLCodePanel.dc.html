<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative; box-sizing:border-box; height:100%; display:flex; flex-direction:column; background:#141517; color:#EDEBE7; font-family:'Geist Mono',monospace;">
  <div style="flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px; height:48px; padding-left:20px; border-bottom:1px solid rgba(255,255,255,0.08);">
    <span style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#8C8A86;">{{ label }}</span>
    <button onClick="{{ copy }}" aria-label="copy" style="flex:none; height:44px; min-width:44px; padding:0 14px; display:flex; align-items:center; justify-content:center; background:none; border:0; color:#8C8A86; cursor:pointer; font-family:'Geist Mono',monospace;" style-hover="color:#EDEBE7;" style-focus="outline:2px solid #FF5B1F; outline-offset:-2px;">
      <sc-if value="{{ copied }}"><span style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#EDEBE7;">copied</span></sc-if>
      <sc-if value="{{ notCopied }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5.5" y="5.5" width="8.5" height="8.5"></rect><path d="M2.5 10.5V2.5h8"></path></svg></sc-if>
    </button>
  </div>
  <div style="position:relative; flex:1; overflow:hidden; padding:16px 0 20px; max-height:{{ maxH }}; font-size:13px; line-height:19px;">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
      <div style="display:flex; gap:16px; min-height:19px; padding-left:20px;">
        <span style="flex:none; width:22px; text-align:right; color:#8C8A86; user-select:none;">{{ r.n }}</span>
        <span style="flex:1; min-width:0; display:flex; gap:8px; align-items:{{ align }}; overflow:hidden; padding-right:20px; white-space:{{ ws }}; color:{{ r.color }};">
          <sc-if value="{{ r.x }}"><svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="1.4" style="flex:none; margin-top:{{ glyphTop }};"><path d="M1 1l7 7M8 1L1 8"></path></svg></sc-if>
          <sc-if value="{{ r.ok }}"><svg width="10" height="9" viewBox="0 0 10 9" fill="none" stroke="currentColor" stroke-width="1.4" style="flex:none; margin-top:{{ glyphTop }};"><path d="M1 4.8L3.8 7.6L9 1.2"></path></svg></sc-if>
          <span style="min-width:0;">{{ r.t }}</span>
        </span>
      </div>
    </sc-for>
    <sc-if value="{{ noWrap }}"><div style="position:absolute; top:0; right:0; bottom:0; width:48px; background:linear-gradient(to right, #14151700, #141517);"></div></sc-if>
    <sc-if value="{{ isCollapsed }}"><div style="position:absolute; left:0; right:0; bottom:0; height:76px; background:linear-gradient(to bottom, #14151700, #141517 85%);"></div></sc-if>
  </div>
  <sc-if value="{{ canCollapse }}">
    <button onClick="{{ toggle }}" style="flex:none; height:44px; display:flex; align-items:center; padding:0 20px; background:none; border:0; border-top:1px solid rgba(255,255,255,0.08); color:#EDEBE7; font-family:'Geist Mono',monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; text-align:left;" style-focus="outline:2px solid #FF5B1F; outline-offset:-2px;">{{ toggleLabel }}</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:320},&quot;lines&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;,&quot;default&quot;:[&quot;## Tokens&quot;,&quot;| Accent | #C41E3A |&quot;]},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SKILL.md&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;wrap&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const BRIGHT = /^(#|---|\[|✕|→|›|Pass |Read |PLAN|name:)/;
class Component extends DCLogic {
  state = { copied: false, expanded: false };
  copy = () => {
    const text = (this.props.lines || []).join('\n');
    try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) {}
    this.setState({ copied: true });
    clearTimeout(this.t);
    this.t = setTimeout(() => this.setState({ copied: false }), 2000);
  };
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const lines = this.props.lines || [];
    const wrap = !!this.props.wrap;
    const c = this.props.collapsed;
    const canCollapse = !!c && lines.length > c;
    const collapsed = canCollapse && !this.state.expanded;
    return {
      label: this.props.label ?? '',
      copy: this.copy, copied: this.state.copied, notCopied: !this.state.copied,
      rows: lines.map((l, i) => {
        const x = l.startsWith('✕ '), ok = l.startsWith('✓ ');
        return { n: String(i + 1), t: x || ok ? l.slice(2) : l, x, ok, color: BRIGHT.test(l) ? '#EDEBE7' : '#B4B2AD' };
      }),
      ws: wrap ? 'pre-wrap' : 'pre', align: wrap ? 'flex-start' : 'center', glyphTop: wrap ? '5px' : '0',
      noWrap: !wrap, maxH: collapsed ? `${c * 19 + 36}px` : 'none',
      isCollapsed: collapsed, canCollapse,
      toggle: () => this.setState(s => ({ expanded: !s.expanded })),
      toggleLabel: this.state.expanded ? 'show less' : `show all · ${lines.length} lines`,
    };
  }
}
</script>
</body>
</html>
